name: Windows 冒烟测试（真实 Windows 运行器）

# 在 ubuntu 上用 scripts/build.sh 交叉编译 NSIS 安装包，然后在 windows-latest 上：
# 静默安装 → 隐藏自检（--selftest）→ 启动程序截图 / 单实例 → 内置 Python 转换 → FFmpeg gdigrab 录屏 → 静默卸载，
# 并在 Windows 上原生运行 Go 单元测试。截图、日志与通过测试的安装包作为 artifact 上传。
on:
  workflow_dispatch:
    inputs:
      release:
        description: "测试通过后发布 GitHub Release（版本号取 wails.json）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  WAILS_VERSION: "v2.17.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 NSIS / Wails / 测试用 Python 依赖
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis zip unzip
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/pip" install -q pdf2docx==0.5.13 python-docx markdown "PyMuPDF<1.27" "opencv-python-headless<4.13" "numpy<2.4"
      - name: 构建 Windows 安装包与便携版（scripts/build.sh）
        env:
          DT_TEST_PYTHON: ${{ runner.temp }}/pyenv/bin/python
          TOOLS: ${{ runner.temp }}/tools
        run: |
          bash scripts/build.sh
          mkdir -p out
          cp "dist/桌面工具箱-Setup-x64.exe" out/DesktopToolbox-Setup-x64.exe
          cp "dist/桌面工具箱-便携版-x64.zip" out/DesktopToolbox-Portable-x64.zip
          echo "${GITHUB_SHA}" > out/COMMIT.txt
          sha256sum out/* | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: out/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ${{ runner.temp }}/build
      - name: 准备 ffprobe（仅用于校验录屏时长与 Go 录屏测试）
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg-ci.zip"
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-ci"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-ci" -Recurse -Filter ffprobe.exe | Select-Object -First 1).DirectoryName
          "FFBIN=$bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & "$bin\ffprobe.exe" -version | Select-Object -First 1
      - name: 系统信息
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
          Get-CimInstance Win32_VideoController | Select-Object Name, CurrentHorizontalResolution, CurrentVerticalResolution | Format-List
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2 runtime: $($wv.pv)"
          Get-Content "$env:RUNNER_TEMP\build\SHA256SUMS.txt"
      - name: 冒烟测试（安装 / 自检 / 启动截图 / 单实例 / 转换 / 录屏 / 卸载）
        id: smoke
        run: >-
          pwsh -NoProfile -File tests/windows/smoke.ps1
          -Installer "$env:RUNNER_TEMP\build\DesktopToolbox-Setup-x64.exe"
          -OutDir "$env:RUNNER_TEMP\smoke"
          -FFprobe "$env:FFBIN\ffprobe.exe"
      - name: Go 单元测试（Windows 原生，使用便携版内置 Python）
        if: always()
        run: |
          $port = "$env:RUNNER_TEMP\portable"
          Expand-Archive "$env:RUNNER_TEMP\build\DesktopToolbox-Portable-x64.zip" -DestinationPath $port -Force
          $py = (Get-ChildItem $port -Recurse -Filter python.exe | Select-Object -First 1).FullName
          "portable python: $py"
          $env:DT_TEST_PYTHON = $py
          $env:PATH = "$env:FFBIN;$env:PATH"
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go test -count=1 -v ./internal/... 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\smoke\go-test.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: 上传截图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-results
          path: ${{ runner.temp }}/smoke
          retention-days: 14
      - name: 上传通过测试的安装包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tested-installer
          path: ${{ runner.temp }}/build/*
          compression-level: 0
          retention-days: 30

  release:
    needs: smoke
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: out
      - name: 整理发布文件
        id: tag
        run: |
          echo "tag=v$(sed -n 's/.*"productVersion": *"\([^"]*\)".*/\1/p' wails.json | head -1)" >> "$GITHUB_OUTPUT"
          mkdir dist
          # GitHub 会去掉附件名里的中文，所以用英文文件名
          cp out/DesktopToolbox-Setup-x64.exe "dist/DesktopToolbox-0.2.0-Setup-x64.exe"
          cp out/DesktopToolbox-Portable-x64.zip "dist/DesktopToolbox-0.2.0-Portable-x64.zip"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 桌面工具箱 ${{ steps.tag.outputs.tag }}（Windows x64）
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## 下载（Windows 10/11 x64）

            | 文件 | 说明 |
            | --- | --- |
            | `DesktopToolbox-0.2.0-Setup-x64.exe` | 安装包（约 93 MB），双击安装，装好后名为「桌面工具箱」 |
            | `DesktopToolbox-0.2.0-Portable-x64.zip` | 便携版，解压即用 |

            ## 0.2.0 新功能（全部本地离线）
            - 截图工具栏：存桌面、截图识字（中英文、链接可点）、翻译（英⇄中）、改写（润色/精简/扩写/正式 + 自定义指令）
            - 图片转 Word / Excel（表格为真表格），扫描版 PDF 转 Word（OCR）
            - 去水印（画笔涂抹 + LaMa 修补，仅处理你有权使用的图片）
            - 会议记录：逐字稿、说话人与时间戳、本地模型生成摘要/要点/待办，导出 DOCX / MD
            - 新图标

            AI 组件和模型在首次使用对应功能时下载，有进度显示，之后完全离线。
            已在 GitHub Actions windows-latest 上通过安装、启动、各工具页、卸载与 AI 引擎真实模型冒烟测试。
