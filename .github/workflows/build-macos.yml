name: 构建 macOS（及可选 Windows）安装包

# 触发：
#   - 推送 v* 标签（如 v0.1.0）：构建 arm64 + x64 两个 DMG 和 Windows 安装包，并创建/更新同名 GitHub Release
#   - 手动运行（Actions → 本工作流 → Run workflow）：可选择是否发布 Release、是否同时构建 Windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "创建/更新 GitHub Release 并上传安装包"
        type: boolean
        default: false
      windows:
        description: "同时构建 Windows 安装包（Linux 交叉编译 + NSIS）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"
  WAILS_VERSION: "v2.17.1"
  PBS_TAG: "20261110"     # python-build-standalone 发布标签
  PY_VER: "3.12.16"       # 该标签中的 CPython 3.12 版本

jobs:
  # ------------------------------------------------------------------ 跨平台检查（Linux）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "以下文件需要 gofmt：$out"; exit 1; fi
      - name: go vet（linux / windows / darwin 无 cgo 类型检查）
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
      - name: 单元测试
        run: go test ./internal/...

  # ------------------------------------------------------------------ macOS（arm64 / x64 两个 DMG）
  macos:
    needs: check
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: 缓存下载的 Python / FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/mac-dl
          key: mac-dl-${{ matrix.arch }}-${{ env.PBS_TAG }}-${{ env.PY_VER }}-v1
      - name: go vet（macOS，含 cgo）与单元测试
        run: |
          go vet ./internal/...
          go vet -tags desktop,production .
          go test ./internal/...
      - name: 构建 .app 并打包 DMG
        env:
          HOST_PY: python3
        run: bash scripts/build-macos.sh ${{ matrix.arch }}
      - name: 用打包进 .app 的 Python 运行转换测试
        if: matrix.arch == 'arm64'
        run: DT_TEST_PYTHON="$PWD/build/macos/out-arm64/桌面工具箱.app/Contents/Resources/python/bin/python3" go test -v -run TestConvert ./internal/converter
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopToolbox-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  # ------------------------------------------------------------------ Windows（可选；沿用 scripts/build.sh 在 Linux 上交叉编译）
  windows:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || inputs.windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 NSIS / Wails / 测试用 Python 依赖
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis zip unzip
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/pip" install -q pdf2docx==0.5.13 python-docx markdown "PyMuPDF<1.27" "opencv-python-headless<4.13" "numpy<2.4"
      - name: 构建 Windows 安装包与便携版
        env:
          DT_TEST_PYTHON: ${{ runner.temp }}/pyenv/bin/python
          TOOLS: ${{ runner.temp }}/tools
        run: |
          bash scripts/build.sh
          VERSION="$(sed -n 's/.*"productVersion": *"\([^"]*\)".*/\1/p' wails.json | head -1)"
          mkdir -p out
          cp "dist/桌面工具箱-Setup-x64.exe" "out/DesktopToolbox-$VERSION-Windows-Setup-x64.exe"
          cp "dist/桌面工具箱-便携版-x64.zip" "out/DesktopToolbox-$VERSION-Windows-Portable-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopToolbox-Windows-x64
          path: out/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  # ------------------------------------------------------------------ GitHub Release
  release:
    needs: [macos, windows]
    if: >-
      always() && needs.macos.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') || inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DesktopToolbox-*
          path: out
          merge-multiple: true
      - name: 确定版本标签
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(sed -n 's/.*"productVersion": *"\([^"]*\)".*/\1/p' wails.json | head -1)" >> "$GITHUB_OUTPUT"
          fi
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 桌面工具箱 ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: out/*
          fail_on_unmatched_files: true
          body: |
            ## 下载

            | 系统 | 文件 |
            | --- | --- |
            | macOS · Apple 芯片（M1/M2/M3/M4） | `DesktopToolbox-*-macOS-arm64.dmg` |
            | macOS · Intel 芯片 | `DesktopToolbox-*-macOS-x64.dmg` |
            | Windows 10/11 x64 | `DesktopToolbox-*-Windows-Setup-x64.exe`（安装版）或 `…-Portable-x64.zip`（便携版） |

            不确定 Mac 是哪种芯片：点左上角  → 关于本机，“芯片”一栏写 Apple M… 选 arm64，写 Intel 选 x64。

            ## macOS 首次打开

            本程序没有 Apple 开发者证书（仅 ad-hoc 签名、未公证），第一次打开会被拦截：

            - **macOS 14 及更早**：把 app 拖进“应用程序”后，按住 Control 点按（或右键）“桌面工具箱” → **打开** → 打开。
            - **macOS 15 及更新**：先双击一次，然后到 **系统设置 → 隐私与安全性**，在页面底部点 **仍要打开**。
            - 或在“终端”执行：`xattr -cr /Applications/桌面工具箱.app`

            截图/录屏需要在 **系统设置 → 隐私与安全性 → 屏幕录制** 中允许“桌面工具箱”（之后重新打开程序）；录制声音还需要 **麦克风** 权限。
            每次更新版本后可能需要重新授权一次。
